<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>og-image</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Cormorant+Garamond:ital@1&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap&text=%E2%80%94%20HUB">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #F5F1EA; color: #141A2E; }
    body { position: relative; font-family: 'Be Vietnam Pro', sans-serif; }
    .frame { position: absolute; inset: 28px; border: 1px solid rgba(20,26,46,.18); border-radius: 26px; }
    .ring { position: absolute; right: -300px; top: 50%; width: 720px; height: 720px; transform: translateY(-50%); }
    .ring line, .ring circle.l, .ring path { fill: none; stroke: #141A2E; stroke-width: 1; opacity: .35; }
    .ring path.star { stroke: #B8893B; opacity: .7; }
    .ring circle.d { fill: #B8893B; }
    .ring text { font-family: 'Newsreader', serif; font-style: italic; font-size: 26px; fill: #3A3F52; }
    .copy { position: absolute; left: 92px; top: 92px; width: 640px; }
    .eyebrow { font-size: 18px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: #85601F; }
    h1 { margin-top: 26px; font-family: 'Newsreader', serif; font-weight: 340; font-size: 84px; line-height: 1.06; letter-spacing: -.02em; }
    h1 em { font-weight: 300; }
    .en { margin-top: 22px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 34px; color: #3A3F52; }
    .sig { position: absolute; left: 92px; bottom: 92px; font-family: 'Dancing Script', cursive; font-size: 44px; color: #85601F; transform: rotate(-4deg); }
    .url { position: absolute; left: 92px; bottom: 40px; font-size: 18px; color: #625D57; letter-spacing: .04em; }
  </style>
</head>
<body>
  <div class="frame"></div>
  <svg class="ring" viewBox="0 0 600 600" id="ring"></svg>
  <div class="copy">
    <p class="eyebrow">Một trang nhỏ để ngẫm về mình</p>
    <h1>Thấu Hiểu &amp;<br><em>Phát Triển Bản Thân</em></h1>
    <p class="en">Understand Yourself · Grow Yourself</p>
  </div>
  <p class="sig">— HUB</p>
  <p class="url">Thần số học · và nhiều chủ đề sắp ra mắt</p>
  <script>
    const c = 300, svg = document.getElementById('ring');
    const pt = (n, r) => { const a = (n / 9) * Math.PI * 2 - Math.PI / 2; return [c + r * Math.cos(a), c + r * Math.sin(a)]; };
    let h = '<circle class="l" cx="300" cy="300" r="286"/><circle class="l" cx="300" cy="300" r="236"/><circle class="l" cx="300" cy="300" r="120"/>';
    const star = [1, 4, 2, 8, 5, 7, 1].map((n, i) => (i ? 'L' : 'M') + pt(n % 9, 236).join(' ')).join(' ');
    const tri = [3, 6, 9, 3].map((n, i) => (i ? 'L' : 'M') + pt(n % 9, 236).join(' ')).join(' ');
    h += `<path class="star" d="${star}"/><path class="star" d="${tri}"/>`;
    for (let n = 1; n <= 9; n++) {
      const [x, y] = pt(n % 9, 236), [tx, ty] = pt(n % 9, 258);
      h += `<circle class="d" cx="${x}" cy="${y}" r="4"/><text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central">${n}</text>`;
    }
    svg.innerHTML = h;
  </script>
</body>
</html>
