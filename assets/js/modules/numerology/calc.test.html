<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kiểm thử calc.js · Thần số học</title>
  <style>
    body { margin: 0; padding: 24px; background: #F5F1EA; color: #141A2E; font: 15px/1.6 system-ui, sans-serif; }
    h1 { font: 500 22px/1.3 Georgia, serif; margin: 0 0 4px; }
    #summary { margin: 0 0 20px; font-weight: 600; }
    #summary.pass { color: #2f6b3a; }
    #summary.fail { color: #a24a2a; }
    table { width: 100%; border-collapse: collapse; background: #FBF8F3; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(20,26,46,.12); vertical-align: top; }
    td.ok { color: #2f6b3a; }
    td.bad { color: #a24a2a; font-weight: 600; }
    code { font-size: 13px; }
  </style>
</head>
<body>
  <h1>Kiểm thử calc.js</h1>
  <p id="summary">Đang chạy…</p>
  <table>
    <thead><tr><th>Kết quả</th><th>Trường hợp</th><th>Mong đợi</th><th>Thực tế</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <script type="module">
    import {
      lifePath, personalYear, nameNumbers, normalizeName, validateBirthDate, isRealDate,
      stepsToString, reduceKeepMasters, nameLetters,
    } from './calc.js';

    const tests = [];
    const t = (name, actual, expected) => tests.push({ name, actual, expected });
    const nn = (s, o) => nameNumbers(s, o);
    const pick = (r) => ({ value: r.value, display: r.display });

    /* --- Bắt buộc theo brief, mục 8.4 --- */
    const lp = lifePath({ day: 22, month: 6, year: 2002 });
    t('22/06/2002 → Số chủ đạo 5', lp.value, 5);
    t('22/06/2002 → phép tính từng bước', stepsToString(lp.steps), '2+2+0+6+2+0+0+2 = 14 → 1+4 = 5');

    const py = personalYear({ day: 22, month: 6 }, 2026);
    t('22/06/2002, năm 2026 → Năm cá nhân 2', py.value, 2);
    t('Năm cá nhân 2026 → phép tính', stepsToString(py.steps), '2+2+0+6+2+0+2+6 = 20 → 2+0 = 2');

    const bh = nn('Bảo Huy');
    t('"Bảo Huy" → chuẩn hoá', bh.name, 'BAO HUY');
    t('"Bảo Huy" → Sứ mệnh 9', bh.expression.value, 9);
    t('"Bảo Huy" → Sứ mệnh, phép tính', stepsToString(bh.expression.steps), '2+1+6+8+3+7 = 27 → 2+7 = 9');
    t('"Bảo Huy" → Linh hồn 8 (A1+O6+U3+Y7 = 17)', stepsToString(bh.soul.steps), '1+6+3+7 = 17 → 1+7 = 8');
    t('"Bảo Huy" → Linh hồn 8', bh.soul.value, 8);
    t('"Bảo Huy" → Nhân cách 1 (B2+H8 = 10)', stepsToString(bh.personality.steps), '2+8 = 10 → 1+0 = 1');
    t('"Bảo Huy" → Nhân cách 1', bh.personality.value, 1);

    const hub = nn('HUB');
    t('"HUB" → Sứ mệnh 4 (13 → 4)', stepsToString(hub.expression.steps), '8+3+2 = 13 → 1+3 = 4');
    t('"HUB" → Linh hồn 3', hub.soul.value, 3);
    t('"HUB" → Nhân cách 1', hub.personality.value, 1);

    /* --- Ngày 29/02 --- */
    t('29/02/2024 là ngày có thật (năm nhuận)', isRealDate(29, 2, 2024), true);
    t('29/02/2023 không có thật', isRealDate(29, 2, 2023), false);
    t('29/02/2000 có thật (chia hết cho 400)', isRealDate(29, 2, 2000), true);
    t('29/02/1900 không có thật (chia hết cho 100)', isRealDate(29, 2, 1900), false);
    const today = new Date(2026, 9, 26);
    t('Kiểm tra form: 29/02/2024 hợp lệ', validateBirthDate({ day: '29', month: '02', year: '2024' }, { today }).ok, true);
    t('Kiểm tra form: 29/02/2023 báo lỗi năm không nhuận',
      validateBirthDate({ day: '29', month: '2', year: '2023' }, { today }).errors.day,
      'Năm 2023 không phải năm nhuận nên tháng 2 chỉ có 28 ngày.');
    t('Kiểm tra form: 31/04 báo lỗi', validateBirthDate({ day: '31', month: '4', year: '2001' }, { today }).errors.day, 'Tháng 4 năm 2001 chỉ có 30 ngày.');
    t('Kiểm tra form: năm 1899 bị chặn', !!validateBirthDate({ day: '1', month: '1', year: '1899' }, { today }).errors.year, true);
    t('Kiểm tra form: năm sau năm hiện tại bị chặn', !!validateBirthDate({ day: '1', month: '1', year: '2027' }, { today }).errors.year, true);
    t('Kiểm tra form: ngày chưa tới trong năm nay bị chặn', !!validateBirthDate({ day: '30', month: '12', year: '2026' }, { today }).errors.day, true);
    t('29/02/2024 → Số chủ đạo (2+9+0+2+2+0+2+4 = 21 → 3)', lifePath({ day: 29, month: 2, year: 2024 }).value, 3);

    /* --- Tổng ra 10, 11, 22, 33 theo cả hai cách tính --- */
    const d10 = { day: 1, month: 1, year: 2006 }; // 0+1+0+1+2+0+0+6 = 10
    t('Tổng 10, cách vn → 10', pick(lifePath(d10, { method: 'vn' })), { value: 10, display: '10' });
    t('Tổng 10, cách western → 1', pick(lifePath(d10, { method: 'western' })), { value: 1, display: '1' });

    const d46 = { day: 19, month: 9, year: 1989 }; // 1+9+0+9+1+9+8+9 = 46 → 10
    t('Tổng 46, cách vn → 10 (dừng khi ≤ 11)', stepsToString(lifePath(d46, { method: 'vn' }).steps), '1+9+0+9+1+9+8+9 = 46 → 4+6 = 10');
    t('Tổng 46, cách western → 1', stepsToString(lifePath(d46, { method: 'western' }).steps), '1+9+0+9+1+9+8+9 = 46 → 4+6 = 10 → 1+0 = 1');

    const d11 = { day: 1, month: 1, year: 2007 }; // 11
    t('Tổng 11, cách vn → 11', lifePath(d11, { method: 'vn' }).value, 11);
    t('Tổng 11, cách western → 11', lifePath(d11, { method: 'western' }).value, 11);

    const d38 = { day: 28, month: 9, year: 1999 }; // 2+8+0+9+1+9+9+9 = 47 → 11
    t('Tổng 47 → 11 ở cả hai cách', [lifePath(d38, { method: 'vn' }).value, lifePath(d38, { method: 'western' }).value], [11, 11]);

    const d22 = { day: 1, month: 2, year: 1990 }; // 0+1+0+2+1+9+9+0 = 22
    t('Tổng 22, cách vn → 22/4', pick(lifePath(d22, { method: 'vn' })), { value: 22, display: '22/4' });
    t('Tổng 22, cách western → 22/4', pick(lifePath(d22, { method: 'western' })), { value: 22, display: '22/4' });

    const d33 = { day: 29, month: 3, year: 1990 }; // 2+9+0+3+1+9+9+0 = 33
    t('Tổng 33, cách vn → 33/6', pick(lifePath(d33, { method: 'vn' })), { value: 33, display: '33/6' });
    t('Tổng 33, cách western → 33/6', pick(lifePath(d33, { method: 'western' })), { value: 33, display: '33/6' });

    t('Rút gọn tên: 29 → 11 (giữ số bậc thầy)', reduceKeepMasters(29).value, 11);
    t('Rút gọn tên: 22 giữ nguyên', reduceKeepMasters(22).value, 22);
    t('Rút gọn tên: 10 → 1', reduceKeepMasters(10).value, 1);

    /* --- Họ tên --- */
    t('Tên có chữ Đ: "Đặng" → DANG', normalizeName('Đặng'), 'DANG');
    t('Tên có chữ đ thường: "đào" → DAO', normalizeName('đào'), 'DAO');
    const dang = nn('Đặng');
    t('"Đặng": Sứ mệnh 8 (4+1+5+7 = 17)', dang.expression.value, 8);
    t('"Đặng": Linh hồn 1, Nhân cách 7', [dang.soul.value, dang.personality.value], [1, 7]);
    t('Chuỗi tổ hợp NFD vẫn chuẩn hoá đúng', normalizeName('Bảo Huy'), 'BAO HUY');
    t('Khoảng trắng thừa: "  Bảo   Huy  " → BAO HUY', normalizeName('  Bảo   Huy  '), 'BAO HUY');
    const spaced = nn('  Bảo   Huy  ');
    t('Khoảng trắng thừa không đổi kết quả', [spaced.expression.value, spaced.soul.value, spaced.personality.value], [9, 8, 1]);
    t('Ký tự lạ bị bỏ: "Huy-2 (Bảo)!" → HUY BAO', normalizeName('Huy-2 (Bảo)!'), 'HUY BAO');
    t('Tên gõ dở vẫn giữ khoảng trắng cuối khi đang gõ', normalizeName('Bảo ', { trim: false }), 'BAO ');
    t('Chip chữ cái "Bảo Huy"', nameLetters('Bảo Huy').map((l) => (l.space ? '_' : l.ch + l.value + (l.vowel ? 'v' : 'c'))).join(' '),
      'B2c A1v O6v _ H8c U3v Y7v');
    const yCons = nn('Bảo Huy', { yIsVowel: false });
    t('Tuỳ chọn Y là phụ âm: Linh hồn 1, Nhân cách 8, Sứ mệnh 9', [yCons.soul.value, yCons.personality.value, yCons.expression.value], [1, 8, 9]);
    t('Tên toàn phụ âm: Linh hồn để trống', nn('NGH').soul.value, null);
    t('Tên rỗng: Sứ mệnh để trống', nn('   ').expression.value, null);

    /* --- Hiển thị kết quả --- */
    const rows = document.getElementById('rows');
    let passed = 0;
    for (const x of tests) {
      const ok = JSON.stringify(x.actual) === JSON.stringify(x.expected);
      if (ok) passed++;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="${ok ? 'ok' : 'bad'}">${ok ? 'Đạt' : 'Trượt'}</td><td></td><td><code></code></td><td><code></code></td>`;
      tr.children[1].textContent = x.name;
      tr.children[2].firstChild.textContent = JSON.stringify(x.expected);
      tr.children[3].firstChild.textContent = JSON.stringify(x.actual);
      rows.appendChild(tr);
    }
    const summary = document.getElementById('summary');
    const all = passed === tests.length;
    summary.textContent = `${passed}/${tests.length} trường hợp đạt.`;
    summary.className = all ? 'pass' : 'fail';
    window.__TEST_RESULT__ = { passed, total: tests.length, failed: tests.filter((x) => JSON.stringify(x.actual) !== JSON.stringify(x.expected)).map((x) => x.name) };
  </script>
</body>
</html>
