<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kiểm thử calc.js · Nghề nghiệp hôm nay & ngày mai</title>
  <style>
    body { margin: 0; padding: 24px; background: #F5F1EA; color: #141A2E; font: 15px/1.6 system-ui, sans-serif; }
    h1 { font: 500 22px/1.3 Georgia, serif; margin: 0 0 4px; }
    #summary { margin: 0 0 20px; font-weight: 600; }
    #summary.pass { color: #2f6b3a; }
    #summary.fail { color: #a24a2a; }
    table { width: 100%; border-collapse: collapse; background: #FBF8F3; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(20,26,46,.12); vertical-align: top; }
    td.ok { color: #2f6b3a; }
    td.bad { color: #a24a2a; font-weight: 600; }
    code { font-size: 13px; }
  </style>
</head>
<body>
  <h1>Kiểm thử: chỉ số AI, mức dự báo, lọc theo mã Holland, dữ liệu 41 nghề</h1>
  <p id="summary">Đang chạy…</p>
  <table>
    <thead><tr><th>Kết quả</th><th>Trường hợp</th><th>Mong đợi</th><th>Thực tế</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script type="module">
    import * as F from './calc.js';
    import JOBS from './jobs/index.js';
    import { SOURCES, FIELDS } from './content.js';

    const tests = [];
    const t = (name, actual, expected) => tests.push({ name, actual, expected });
    const J = (id, demand, tasks, holland = 'RIC', field = 'cntt') => ({ id, demand, tasks, holland, field });

    /* --- Chỉ số AI từ bảng nhiệm vụ --- */
    t('Toàn nhiệm vụ cao → 5', F.aiIndex([['a', 'cao'], ['b', 'cao']]), 5);
    t('Toàn nhiệm vụ thấp → 1', F.aiIndex([['a', 'thap'], ['b', 'thap']]), 1);
    t('Toàn nhiệm vụ vừa → 3', F.aiIndex([['a', 'vua'], ['b', 'vua'], ['c', 'vua']]), 3);
    t('3 cao, 1 vừa, 2 thấp → 1 + 4 × 3,5/6 = 3,33 → 3,5', F.aiIndex([['a', 'cao'], ['b', 'cao'], ['c', 'cao'], ['d', 'vua'], ['e', 'thap'], ['f', 'thap']]), 3.5);
    t('1 cao, 4 thấp → 1,8 → 2', F.aiIndex([['a', 'cao'], ['b', 'thap'], ['c', 'thap'], ['d', 'thap'], ['e', 'thap']]), 2);
    t('Bỏ qua mức lạ; rỗng → null', [F.aiIndex([['a', 'cao'], ['b', 'xyz']]), F.aiIndex([])], [5, null]);

    /* --- Thời tiết và gió --- */
    t('Nhu cầu 1, 2 → mưa; 2,5–3,5 → mây; 4, 5 → nắng', [1, 2, 2.5, 3, 3.5, 4, 5].map(F.skyOf), ['mua', 'mua', 'may', 'may', 'may', 'nang', 'nang']);
    t('Gió: 1,5 → 2; 3 → 3; 3,5 → 4; 5 → 5', [1.5, 3, 3.5, 5].map(F.windOf), [2, 3, 4, 5]);

    /* --- Bản đồ --- */
    t('Toạ độ: nhu cầu 1, AI 1 ở góc dưới trái; 5, 5 ở góc trên phải', [F.position({ demand: 1, ai: 1 }), F.position({ demand: 5, ai: 5 })], [{ x: 0, y: 1 }, { x: 1, y: 0 }]);
    t('Bốn ô: (4,2) tăng-ít; (4,4) tăng-nhiều; (2,4) giảm-nhiều; (2,2) giảm-ít',
      [F.quadrant({ demand: 4, ai: 2 }), F.quadrant({ demand: 4, ai: 4 }), F.quadrant({ demand: 2, ai: 4 }), F.quadrant({ demand: 2, ai: 2 })],
      ['grow-safe', 'grow-change', 'shrink-change', 'shrink-safe']);
    t('Mức trung tính: nhu cầu 3 thuộc nhóm đi ngang; chỉ số AI 3 là vừa', [F.quadrant({ demand: 3, ai: 3 }), F.quadrant({ demand: 3.5, ai: 3.5 })], ['shrink-safe', 'grow-change']);
    const pts = F.spread([{ id: 'a', demand: 3, ai: 3 }, { id: 'b', demand: 3, ai: 3 }, { id: 'c', demand: 4, ai: 2 }]);
    t('Chấm trùng toạ độ được tách, chấm đơn giữ nguyên', [pts.get('a').x !== pts.get('b').x, pts.get('c')], [true, { x: 0.75, y: 0.75 }]);
    const six = F.spread(['a', 'b', 'c', 'd', 'e', 'f'].map((id) => ({ id, demand: 3, ai: 3 })));
    const dmax = Math.max(...[...six.values()].map((p) => Math.hypot(p.x - 0.5, p.y - 0.5)));
    t('Cụm 6 chấm nằm trong nửa bậc (< 0,0625) quanh tâm', dmax < 0.0625, true);

    /* --- Mã Holland --- */
    t('Hai mã trùng hẳn → 14', F.hollandFit('SAE', 'SAE'), 14);
    t('Chữ đầu trùng nhau → ít nhất 9', F.hollandFit('SIR', 'SAE') >= 9, true);
    t('Không có chữ chung → 0', F.hollandFit('RIC', 'SAE'), 0);
    t('Chữ đầu của nghề là chữ thứ hai của người dùng → 6 (đủ ngưỡng)', [F.hollandFit('AIR', 'SAE'), F.FIT_MIN], [6, 6]);
    t('Mã hợp lệ: 1–3 chữ RIASEC không lặp', ['S', 'SAE', 'SAA', 'SAEC', 'XYZ', ''].map(F.validHolland), [true, true, false, false, false, false]);
    const sample = [J('a', 3, [], 'SAE', 'giaoduc'), J('b', 3, [], 'RIC', 'cntt'), J('c', 3, [], 'ASE', 'thietke'), J('d', 3, [], 'ESC', 'kinhdoanh')];
    t('Lọc theo mã SAE: giữ nghề khớp, xếp theo độ khớp', F.filterJobs(sample, { holland: 'SAE' }).map((j) => j.id), ['a', 'c', 'd']);
    t('Lọc theo lĩnh vực', F.filterJobs(sample, { field: 'cntt' }).map((j) => j.id), ['b']);
    t('Lọc cả hai điều kiện', F.filterJobs(sample, { field: 'cntt', holland: 'SAE' }).length, 0);

    /* --- Dữ liệu 41 nghề --- */
    t('Có từ 30 đến 50 nghề, id không trùng', [JOBS.length >= 30 && JOBS.length <= 50, new Set(JOBS.map((j) => j.id)).size === JOBS.length], [true, true]);
    t('Mọi nghề có mã Holland hợp lệ và lĩnh vực có trong danh sách', JOBS.filter((j) => !F.validHolland(j.holland) || !FIELDS[j.field]).map((j) => j.id), []);
    t('Nhu cầu trong 1–5, bước nửa bậc', JOBS.filter((j) => !(j.demand >= 1 && j.demand <= 5 && Number.isInteger(j.demand * 2))).map((j) => j.id), []);
    t('Mỗi nghề có 4–6 nhiệm vụ với mức hợp lệ', JOBS.filter((j) => j.tasks.length < 4 || j.tasks.length > 6 || j.tasks.some((x) => !(x[1] in F.TASK_WEIGHT))).map((j) => j.id), []);
    t('Mọi khoá nguồn của nghề có trong danh mục nguồn', JOBS.flatMap((j) => j.src.filter((s) => !SOURCES[s]).map((s) => `${j.id}:${s}`)), []);
    t('Mọi nghề đủ trường nội dung', JOBS.filter((j) => !['summary', 'aiText', 'entry', 'demandWhy', 'fit', 'note'].every((k) => j[k]) || j.risks.length < 2 || j.test.length < 2).map((j) => j.id), []);
    t('Giao dịch viên ngân hàng (có số liệu cắt giảm ở Việt Nam) ở mức mưa', F.skyOf(JOBS.find((j) => j.id === 'giao-dich-vien').demand), 'mua');
    t('Hành chính, nhập liệu có chỉ số AI ≥ 3,5 (nhóm tiếp xúc cao nhất theo ILO)', F.aiIndex(JOBS.find((j) => j.id === 'hanh-chinh').tasks) >= 3.5, true);
    t('Điều dưỡng có chỉ số AI ≤ 2,5 (chăm sóc trực tiếp)', F.aiIndex(JOBS.find((j) => j.id === 'dieu-duong').tasks) <= 2.5, true);

    /* --- Hiển thị --- */
    const rows = document.getElementById('rows');
    let passed = 0;
    for (const x of tests) {
      const ok = JSON.stringify(x.actual) === JSON.stringify(x.expected);
      if (ok) passed++;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="${ok ? 'ok' : 'bad'}">${ok ? 'Đạt' : 'Trượt'}</td><td></td><td><code></code></td><td><code></code></td>`;
      tr.children[1].textContent = x.name;
      tr.children[2].firstChild.textContent = JSON.stringify(x.expected);
      tr.children[3].firstChild.textContent = JSON.stringify(x.actual);
      rows.appendChild(tr);
    }
    const summary = document.getElementById('summary');
    summary.textContent = `${passed}/${tests.length} trường hợp đạt.`;
    summary.className = passed === tests.length ? 'pass' : 'fail';
    window.__TEST_RESULT__ = { passed, total: tests.length, failed: tests.filter((x) => JSON.stringify(x.actual) !== JSON.stringify(x.expected)).map((x) => `${x.name} | mong ${JSON.stringify(x.expected)} | ra ${JSON.stringify(x.actual)}`) };
  </script>
</body>
</html>
