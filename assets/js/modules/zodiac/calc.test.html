<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kiểm thử calc.js · Cung hoàng đạo & con giáp</title>
  <style>
    body { margin: 0; padding: 24px; background: #F5F1EA; color: #141A2E; font: 15px/1.6 system-ui, sans-serif; }
    h1 { font: 500 22px/1.3 Georgia, serif; margin: 0 0 4px; }
    #summary { margin: 0 0 20px; font-weight: 600; }
    #summary.pass { color: #2f6b3a; }
    #summary.fail { color: #a24a2a; }
    table { width: 100%; border-collapse: collapse; background: #FBF8F3; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(20,26,46,.12); vertical-align: top; }
    td.ok { color: #2f6b3a; }
    td.bad { color: #a24a2a; font-weight: 600; }
    code { font-size: 13px; }
  </style>
</head>
<body>
  <h1>Kiểm thử: âm lịch, cung hoàng đạo, con giáp</h1>
  <p id="summary">Đang chạy…</p>
  <table>
    <thead><tr><th>Kết quả</th><th>Trường hợp</th><th>Mong đợi</th><th>Thực tế</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <script type="module">
    import { solarToLunar, tetOf, yearCanChi, jdFromDate, jdToDate } from '../../core/lunar.js';
    import { validateDate } from '../../core/date-input.js';
    import * as Z from './calc.js';

    const tests = [];
    const t = (name, actual, expected) => tests.push({ name, actual, expected });
    const lun = (d, m, y) => {
      const l = solarToLunar(d, m, y);
      return `${l.day}/${l.month}${l.leap ? ' nhuận' : ''} ${yearCanChi(l.year).name}`;
    };
    const sign = (d, m) => Z.SIGNS[Z.sunSign(d, m).index].name;
    const P = (d, m, y) => Z.profile({ day: d, month: m, year: y });

    /* --- Bắt buộc --- */
    const a = P(22, 6, 2002);
    t('22/06/2002 → Cự Giải, Nhâm Ngọ, Ngựa, Dương Liễu Mộc',
      [Z.SIGNS[a.sign.index].name, a.canChi.name, a.animal, a.napAm.name], ['Cự Giải', 'Nhâm Ngọ', 'Ngựa', 'Dương Liễu Mộc']);
    t('22/06/2002 là ngày giao cung → ghi chú ranh giới với Song Tử', a.sign.cusp && Z.SIGNS[a.sign.cusp.index].name, 'Song Tử');
    t('22/06/2002 → âm lịch 12/5 Nhâm Ngọ', lun(22, 6, 2002), '12/5 Nhâm Ngọ');

    const b = P(10, 2, 2002);
    t('10/02/2002 → năm âm Tân Tỵ, Rắn', [b.canChi.name, b.animal], ['Tân Tỵ', 'Rắn']);
    t('10/02/2002 sinh trước Tết', b.beforeTet, true);
    t('Tết Nhâm Ngọ là 12/02/2002', tetOf(2002), { day: 12, month: 2, year: 2002 });
    t('12/02/2002 → mồng 1 tháng Giêng Nhâm Ngọ', lun(12, 2, 2002), '1/1 Nhâm Ngọ');
    t('11/02/2002 → 30 tháng Chạp Tân Tỵ', lun(11, 2, 2002), '30/12 Tân Tỵ');

    const c = P(20, 3, 1999);
    t('20/03/1999 (sau Tết 16/02/1999) → Kỷ Mão, Mèo, Thành Đầu Thổ', [c.canChi.name, c.animal, c.napAm.name], ['Kỷ Mão', 'Mèo', 'Thành Đầu Thổ']);
    t('Tết Kỷ Mão là 16/02/1999', tetOf(1999), { day: 16, month: 2, year: 1999 });
    t('15/02/1999 (trước Tết) vẫn là Mậu Dần, Hổ', [P(15, 2, 1999).canChi.name, P(15, 2, 1999).animal], ['Mậu Dần', 'Hổ']);

    /* --- 10 ngày ngẫu nhiên 1950–2025, đối chiếu lịch vạn niên Việt Nam ---
       Nguồn đối chiếu (tra ngày 27/10/2026): ngaydep.com (17/3/1954, 3/2/1956, 6/3/1978, 11/2/1984, 17/3/1993, 23/1/1971),
       xemlicham.com (8/1/2011, 24/10/2017, 22/3/2018), baohatinh.vn (10/9/2005). */
    const ref = [
      [17, 3, 1954, '13/2 Giáp Ngọ'],
      [3, 2, 1956, '22/12 Ất Mùi'],
      [23, 1, 1971, '27/12 Canh Tuất'],
      [6, 3, 1978, '28/1 Mậu Ngọ'],
      [11, 2, 1984, '10/1 Giáp Tý'],
      [17, 3, 1993, '25/2 Quý Dậu'],
      [10, 9, 2005, '7/8 Ất Dậu'],
      [8, 1, 2011, '5/12 Canh Dần'],
      [24, 10, 2017, '5/9 Đinh Dậu'],
      [22, 3, 2018, '6/2 Mậu Tuất'],
    ];
    ref.forEach(([d, m, y, x]) => t(`${d}/${m}/${y} → ${x} (lịch vạn niên)`, lun(d, m, y), x));

    /* --- Tết Việt Nam, kể cả các năm khác Tết Trung Quốc vì lệch múi giờ --- */
    const tet = { 1968: [29, 1], 1985: [21, 1], 1990: [27, 1], 2000: [5, 2], 2007: [17, 2], 2020: [25, 1], 2024: [10, 2], 2025: [29, 1], 2030: [2, 2] };
    Object.entries(tet).forEach(([y, [d, m]]) => t(`Tết Việt Nam năm ${y} là ${d}/${m}`, tetOf(Number(y)), { day: d, month: m, year: Number(y) }));
    t('Lịch UTC+8 (Trung Quốc) cho Tết 2007 là 18/2, khác Việt Nam', tetOf(2007, 8), { day: 18, month: 2, year: 2007 });
    t('Lịch UTC+8 (Trung Quốc) cho Tết 1985 là 20/2, sớm hơn ở Việt Nam một tháng', tetOf(1985, 8), { day: 20, month: 2, year: 1985 });
    t('Tháng nhuận: 23/5/2020 là 1/4 nhuận Canh Tý', lun(23, 5, 2020), '1/4 nhuận Canh Tý');
    t('jdFromDate/jdToDate khớp nhau', jdToDate(jdFromDate(29, 2, 2024)), { day: 29, month: 2, year: 2024 });

    /* --- Can Chi và nạp âm --- */
    t('1984 → Giáp Tý, Hải Trung Kim', [yearCanChi(1984).name, Z.napAmOf(yearCanChi(1984).cycle).name], ['Giáp Tý', 'Hải Trung Kim']);
    t('1986 → Bính Dần, Lư Trung Hỏa', [yearCanChi(1986).name, Z.napAmOf(yearCanChi(1986).cycle).name], ['Bính Dần', 'Lư Trung Hỏa']);
    t('2024 → Giáp Thìn, Phú Đăng Hỏa', [yearCanChi(2024).name, Z.napAmOf(yearCanChi(2024).cycle).name], ['Giáp Thìn', 'Phú Đăng Hỏa']);
    t('1983 → Quý Hợi, Đại Hải Thủy (cuối vòng 60)', [yearCanChi(1983).name, Z.napAmOf(yearCanChi(1983).cycle).name], ['Quý Hợi', 'Đại Hải Thủy']);
    t('Mỗi hành có đúng 6 tên nạp âm', ['Kim', 'Mộc', 'Thủy', 'Hỏa', 'Thổ'].map((h) => Z.NAP_AM.filter((x) => x[1] === h).length), [6, 6, 6, 6, 6]);
    t('Tên con giáp theo cách người Việt', [Z.ANIMALS[1], Z.ANIMALS[3], Z.ANIMALS[7], Z.ANIMALS[11]], ['Trâu', 'Mèo', 'Dê', 'Lợn']);

    /* --- Cung hoàng đạo theo bảng ngày --- */
    t('Ranh giới đầu và cuối mỗi cung',
      [sign(21, 3), sign(19, 4), sign(20, 4), sign(20, 5), sign(21, 5), sign(21, 6), sign(23, 7), sign(22, 8), sign(23, 8), sign(22, 9), sign(23, 9), sign(22, 10)],
      ['Bạch Dương', 'Bạch Dương', 'Kim Ngưu', 'Kim Ngưu', 'Song Tử', 'Song Tử', 'Sư Tử', 'Sư Tử', 'Xử Nữ', 'Xử Nữ', 'Thiên Bình', 'Thiên Bình']);
    t('Ranh giới quanh năm mới', [sign(23, 10), sign(21, 11), sign(22, 11), sign(21, 12), sign(22, 12), sign(31, 12), sign(1, 1), sign(19, 1), sign(20, 1), sign(18, 2), sign(19, 2), sign(29, 2), sign(20, 3)],
      ['Bọ Cạp', 'Bọ Cạp', 'Nhân Mã', 'Nhân Mã', 'Ma Kết', 'Ma Kết', 'Ma Kết', 'Ma Kết', 'Bảo Bình', 'Bảo Bình', 'Song Ngư', 'Song Ngư', 'Song Ngư']);
    const cusp = (d, m) => { const s = Z.sunSign(d, m); return s.cusp ? Z.SIGNS[s.cusp.index].name : null; };
    t('±1 ngày quanh ngày giao cung (21, 22, 23/6) có ghi chú; 20 và 24/6 thì không', [cusp(20, 6), cusp(21, 6), cusp(22, 6), cusp(23, 6), cusp(24, 6)], [null, 'Cự Giải', 'Song Tử', 'Song Tử', null]);
    t('Ranh giới qua năm: 21/12 và 23/12', [cusp(21, 12), cusp(23, 12)], ['Ma Kết', 'Nhân Mã']);
    t('Khoảng ngày của Cự Giải và Ma Kết', [Z.signRange(3), Z.signRange(9)], [{ from: [6, 22], to: [7, 22] }, { from: [12, 22], to: [1, 19] }]);

    /* --- Bầu trời thật (ranh giới IAU) --- */
    const sky = (d, m, y) => { const r = Z.realSky({ day: d, month: m, year: y }); return r.crossing ? `${r.crossing.from.id}→${r.crossing.to.id}` : r.constellation.id; };
    t('10/12/2000: Mặt Trời ở chòm Xà Phu', sky(10, 12, 2000), 'Oph');
    t('1/4/1990: Mặt Trời ở chòm Song Ngư dù cung là Bạch Dương', [sky(1, 4, 1990), sign(1, 4)], ['Psc', 'Bạch Dương']);
    t('15/9/1975: Mặt Trời còn ở chòm Sư Tử dù cung là Xử Nữ', [sky(15, 9, 1975), sign(15, 9)], ['Leo', 'Xử Nữ']);
    t('Năm 2025: vào Xà Phu ngày 30/11, rời Xà Phu ngày 18/12', [sky(29, 11, 2025), sky(30, 11, 2025), sky(17, 12, 2025), sky(18, 12, 2025)], ['Sco', 'Sco→Oph', 'Oph', 'Oph→Sgr']);
    t('Kinh độ Mặt Trời đầu xuân phân 2024 (20/3) gần 0°', Math.abs(((Z.sunApparentLongitude(jdFromDate(20, 3, 2024) - 0.5 + 3.1 / 24) + 180) % 360) - 180) < 0.05, true);

    /* --- Tam hợp, tứ hành xung, ngũ hành --- */
    t('Tam hợp của Ngọ: Dần, Ngọ, Tuất', Z.tamHopOf(6), [2, 6, 10]);
    t('Tứ hành xung của Mão: Tý, Ngọ, Mão, Dậu', Z.xungOf(3), [0, 6, 3, 9]);
    t('Mộc sinh Hỏa, khắc Thổ; được Thủy sinh, bị Kim khắc', [Z.sinhOf('Mộc'), Z.khacOf('Mộc'), Z.sinhByOf('Mộc'), Z.khacByOf('Mộc')], ['Hỏa', 'Thổ', 'Thủy', 'Kim']);
    t('Thủy khắc Hỏa, Kim sinh Thủy', [Z.khacOf('Thủy'), Z.sinhOf('Kim')], ['Hỏa', 'Thủy']);

    /* --- Kiểm tra ô nhập ngày (dùng chung) --- */
    const today = new Date(2026, 9, 27);
    t('Ngày hợp lệ', validateDate({ day: '22', month: '06', year: '2002' }, { today }).date, { day: 22, month: 6, year: 2002 });
    t('29/02/2023 báo lỗi năm không nhuận', validateDate({ day: '29', month: '2', year: '2023' }, { today }).errors.day, 'Năm 2023 không phải năm nhuận nên tháng 2 chỉ có 28 ngày.');
    t('31/04 báo lỗi', validateDate({ day: '31', month: '4', year: '2001' }, { today }).errors.day, 'Tháng 4 năm 2001 chỉ có 30 ngày.');
    t('Ngày chưa tới bị chặn', !!validateDate({ day: '28', month: '10', year: '2026' }, { today }).errors.day, true);
    t('Ô trống báo đủ ba lỗi', Object.keys(validateDate({}, { today }).errors), ['day', 'month', 'year']);

    /* --- Hiển thị --- */
    const rows = document.getElementById('rows');
    let passed = 0;
    for (const x of tests) {
      const ok = JSON.stringify(x.actual) === JSON.stringify(x.expected);
      if (ok) passed++;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="${ok ? 'ok' : 'bad'}">${ok ? 'Đạt' : 'Trượt'}</td><td></td><td><code></code></td><td><code></code></td>`;
      tr.children[1].textContent = x.name;
      tr.children[2].firstChild.textContent = JSON.stringify(x.expected);
      tr.children[3].firstChild.textContent = JSON.stringify(x.actual);
      rows.appendChild(tr);
    }
    const summary = document.getElementById('summary');
    summary.textContent = `${passed}/${tests.length} trường hợp đạt.`;
    summary.className = passed === tests.length ? 'pass' : 'fail';
    window.__TEST_RESULT__ = { passed, total: tests.length, failed: tests.filter((x) => JSON.stringify(x.actual) !== JSON.stringify(x.expected)).map((x) => `${x.name} | mong ${JSON.stringify(x.expected)} | ra ${JSON.stringify(x.actual)}`) };
  </script>
</body>
</html>
